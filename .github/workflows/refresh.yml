# Healthy.Life auto-refresh
# - Every 6 hours: pulls fresh health headlines, creator videos and food recalls, rebuilds the pages, commits.
# - On a push that changes content, scripts or assets: rebuilds the pages, commits.
# - Manual: Actions > "Healthy.Life auto-refresh" > Run workflow.
# If a gh-pages branch exists it is kept identical to main, so the site is current
# whichever branch GitHub Pages publishes from.
name: Healthy.Life auto-refresh

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "assets/css/**"
      - "assets/js/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: healthy-life-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines, videos and recalls
        run: python3 scripts/update.py
      - name: Rebuild pages
        run: python3 scripts/build.py
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-refresh: headlines, videos and pages ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git push origin HEAD:gh-pages --force
          fi
